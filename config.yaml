# DeepSidekick 主配置
#
# 本文件按 WebUI 页面顺序分组；每段第一行写页面名。
# 只有 id 在这里：role.id / user.id / game.id；角色/用户/游戏内容在 persona/。
#
# 热更（runtime 每 15 秒看一次）：scheduler / cadence / mode / guard / prompt /
#   game、tts.common 的 gain/stream/segments/prefetch、
#   stage 的 cps/bubble、用户/角色的人名与别名。
# 重启 runtime：llm / stt / mic / barge / tts.source 与各 profile 字段 /
#   tts.common.timeout_s / capture /
#   session.live / danmu_source / room_id / sessdata / stage 的 enabled/mode/host/port /
#   memory。

# ═══ LLM 模型 API ═══
llm:
  source: deepseek
  common:
    warmup: true              # 启动时先发一次极短请求，把 system 前缀预热进缓存
    timeout_s: 30
    system_mode: auto
  deepseek:
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key: ''
    temperature: 0.9
    reasoning_effort: low
    # 官方接口不要 UA / session 头，留空即可
    headers: {}
    body: {}

# ═══ 用户设定 ═══
# 用户 id 与全局 Prompt 选项
user:
  id: user
prompt:
  id: default
role:
  id: deepseek

# ── 形象层（全局）──
# WebUI 只显示 enabled/mode/host/port；
# 其余是角色没有覆盖时的默认值，当前角色外观在 persona/roles/<id>/profile.yaml。
stage:
  enabled: true
  host: 127.0.0.1
  port: 17891
  cps: 4.6                    # 气泡翻页速度（字/秒）的初始值，之后每轮自校准
  # live = 直播姬浏览器素材；desktop = Pygame 透明置顶窗
  mode: desktop
  autonomy:
    enabled: true
  actions:
    enabled: true
  bubble:
    gap: 0.4
    max_width: 60
    auto_gap: true
game:
  enabled: true
  id: 'default'
brain:
  visual_memory_tag: true
memory:
  # false = InMemoryHistory + NullLongTerm：不建 SQLite，长期记忆为空
  enabled: true
  # 记忆库：SQLite，WAL；单库，不按游戏拆
  db_path: state/deepsidekick.db
  history_max: 40             # 热窗条数（user 是材料摘要）；40 条约 20 轮
  summarize_every: 16         # 每次总结最老这么多条；16 条约 8 轮
  # 召回：强相关不受 k 限制（每类最多 16 条），弱相关填满 k
  recall_recent: 2            # 最近几条总结每轮常驻
  recall_episodes: 4          # 记忆语义 k
  recall_game: 2              # 游戏池 k
  recall_worldbook: 4         # 世界书 k（与记忆同权）
  recall_min_score: 0.35      # 弱相关阈值
  recall_strong_score: 0.55   # 强相关阈值
  min_keyword_len: 2
  game_recent_plot: 3
  game_npc_max: 6
  task_max: 8

  # 语义模型：记忆页可下载/选择；换模型后重启 runtime
  embed_enabled: true
  embed_model: qwen3-embedding-0.6b-q
  embed_dir: state/embed
  embed_threads: 8
  embed_timeout_ms: 1500

# ═══ 听话（STT） ═══
# ── 识别引擎与模型 ──
stt:
  # 关掉 = NullStt：麦克风仍可让路/打断，但不产生「我说话」。
  enabled: true
  # sherpa-onnx 是唯一后端，推理固定 CPU；换模型只改下面的 models 表 + model。
  model: sensevoice-small     # 指向下面 models 里的 key
  num_threads: 4              # 4~6 最佳；超过物理 P 核没有收益
  model_dir: state/asr        # 所有模型的家目录
  fallback: []                # 主模型起不来时依次试，例如 [firered-ctc]
  min_chars: 2                # 短于此丢弃
  max_chars_per_sec: 12       # 防幻觉：语速上限，超过判为乱码

  # 新增模型 = 在这里加一段 + 把文件放进 model_dir/<dir>，Python 零改动。
  # 文件名不用写死：会按 encoder/decoder/tokens 这类角色在目录里自己找（int8 优先），
  # 这里只写行为参数。
  models:
    sensevoice-small:
      kind: sense-voice
      dir: sensevoice-small
      args:
        language: zh          # 固定 zh，避免短句被 auto 判成 en
        use_itn: true         # 打开标点与数字归一

    paraformer-zh:
      kind: paraformer
      dir: paraformer-zh

    firered-ctc:
      kind: fire-red-asr-ctc
      dir: firered-ctc

    firered-aed:
      kind: fire-red-asr
      dir: firered-aed

    qwen3-asr:
      kind: qwen3-asr
      dir: qwen3-asr
      args:
        max_new_tokens: 256
        hotwords: ''          # 逗号分隔的游戏术语

    whisper-small:
      kind: whisper
      dir: whisper-small
      args:
        language: zh

    whisper-turbo:
      kind: whisper
      dir: whisper-turbo
      args:
        language: zh

mic:
  # 输入始终用 Windows「系统 → 声音 → 输入」的默认设备，不再单独选。
  enabled: true
  # auto = 按默认输出设备的名字判耳机/扬声器，判不出按扬声器（保守）。
  #   形态只影响打断策略；播放期麦克风始终照常进 VAD，不做整段吞音。
  mode: auto
  # 门限百分比：100% 用固定基线；收音偏小往 50 调，游戏声误触发往 150 调。
  gate_percent: 100
  continue_ratio: 0.4         # 开口后放宽到 40%（句中的轻声字不切断）
  start_blocks: 3             # 连续 3 块（90ms）才算开口：枪响、爆音不开段
  silence_ms: 1200            # ★ 连续静音这么久才算"一句说完"（实测句间停顿 1.8~4.9s，不会粘连）
  min_speech_ms: 500          # 说话时长（不含尾部静音）短于这个就丢掉
  max_segment_s: 30           # 单段最长，超了强制切

# 打断（听话页）：播放期照常进 VAD，她播时你说话由这里独立判。
barge:
  enabled: auto               # auto = 耳机才开；on = 总是；off = 关
  min_ms: 600                 # 连续满足条件这么久才打断：咳嗽、碰桌不该切掉她
  ratio: 1.8                  # 仅扬声器：麦克风能量 / 当前播放能量的阈值
  cooldown_ms: 500            # 打断后多久内不再触发

# ═══ 说话（TTS） ═══
tts:
  # 关掉 = NullSpeaker：不合成、不出声；气泡仍照常显示文字。
  enabled: true
  # 当前使用的语音服务（profile 名）；profile 在 WebUI「说话」页新建。
  source: edge
  common:
    gain: 0.55                # 响度归一化；游戏吵就调大
    # true  = 一次请求，厂商原生流式边收边播；不支持流式的厂商自动退回分段。
    # false = 按 segments 逐句合成。
    stream: true
    # sentence 一句一个请求 / two 首句+剩余 / whole 整段
    segments: sentence
    prefetch: true            # 非流式模式下：播前一段时预合成下一段
    timeout_s: 20             # 单次请求读超时（不是整段音频总时长）

  # 内置服务：免 key、不可删除；厂商下拉对它禁用。
  edge:
    preset: edge
    voice: zh-CN-XiaoyiNeural
    rate: +6%
guard:
  max_chars: 70
  min_chars: 2
  extra_patterns: []

# ═══ 画面与节奏 ═══
# ── 截屏 ──
capture:
  enabled: true
  mode: active
  clarity_percent: 66.6
  monitor: 0
  backend: dxgi
  dedupe: true
  subtitle_strip_enabled: true
  ring_size: 60
  interval_s: 1.0
  max_frames: 28
  resolution: 1920x1080
  dedupe_global_threshold: 2.0
  dedupe_block_threshold: 9.0
  subtitle_roi_weight: 1.5
  capture_now_stale_s: 0.8
  privacy_processes:
  - 1password.exe
  - bitwarden.exe
  - dashlane.exe
  - enpass.exe
  - keepass.exe
  - keepassxc.exe
  - keeper.exe
  - lastpass.exe
  - nordpass.exe
  - roboform.exe
  - stickypassword.exe
  - credentialuibroker.exe
  - logonui.exe
  - consent.exe
  - icbc.exe
  - ccb.exe
  - abchina.exe
  - boc.exe
  - bankofchina.exe
  - cmb.exe
  - cmbchina.exe
  - spdb.exe
  - cib.exe
  - psbc.exe
  - bocom.exe
  - cebbank.exe
  - pingan.exe
scheduler:
  # 画面与节奏页：上一轮把 TTS 请求发出去后，至少再等这么久。
  # 必须 ≥ capture.interval_s；代码取两者较大值。
  # 被打断后 note_barge() 会为下一次取材料放行一次。
  min_gap_s: 6.0

  # 听话页：识别出很短的一截话时，等下半句并进同一轮。
  me_wait_short_ms: 800
  me_short_chars: 10

  # 直播设置页：弹幕/礼物/醒目留言攒批；「我说话」不走这两个值。
  batch_s: 12
  batch_events: 4

# ═══ 直播设置 ═══
# 直播模式、消息来源、弹幕攒批、气氛档位
session:
  # 直播模式：关 = 单人陪玩（不连直播间）；开 = 接弹幕/礼物。重启生效。
  live: false

# ── 消息来源 ──
# bili = 连真实直播间；none = 不接收弹幕（截屏和麦克风仍正常）
danmu_source: none
room_id: 0
sessdata: ''
mode:
  auto: true
  manual:
  quiet_max_viewers: 5
  hype_min_viewers: 20
  quiet_max_danmu_5min: 3
  hype_min_danmu_5min: 10
  hysteresis_s: 180

cadence:
  # idle_s = 冷场阈值，从她上一次说完话的那一刻开始算；弹幕攒批走 scheduler.batch_s。
  # 冷场阈值不在 scheduler 里，按下面三个档位分别设置。
  quiet:
    idle_s: 60
  normal:
    idle_s: 45
  hype:
    idle_s: 30

# ═══ 运行内部（不在 WebUI） ═══
errors:
  retry_delay_ms: 400         # 两次请求之间等多久
  fallback_cooldown_s: 40     # 同一种故障，这么多秒内最多说一句
  fallback_max_apologies: 3   # 连续失败这么多个 round 之后就不再道歉了
  recover_say_s: 120          # 中断超过这么久，恢复时说一句「我回来了」
  fallback_dir: state/fallback   # 预录音频放这里（tts_01.wav …）

# ── 状态缓存 ──
state:
  ring_size: 400
  say_log: state/said.jsonl

# ── WebUI 监听 ──
webui:
  host: 127.0.0.1
  port: 17880
  auto_open: true
